# Per-backend autotools settings that do not follow from the build traits in
# backends.txt.  Read by misc/gen_backend_makefiles.py; a backend without a
# section uses the defaults below.
#
# Keys
#   accelerator        "<subdir> <automake conditional>": an accelerator
#                      library built in mpblas/optimized/<name>/<subdir>.
#   smoke_check_only   yes: "make check" in mpblas/test/<name> builds only the
#                      smoke programs (check-all still builds every test).
#   smoke_extra        extra programs for the mpblas/test smoke set.
#   compare_tolerance  relative tolerance for the Rlaruv/Rlamch reference
#                      comparison (misc/num_diff.py); empty means exact diff.
#   compare_rlamch_per_abi
#                      yes: compare Rlamch against Rlamch_reference<bits>.txt
#                      for the configured ABI width.
#   compare_test_env   environment assignments for the compare tests.
#   bench_quadmath_conditional
#                      automake conditional under which the benchmarks link
#                      -lquadmath (backends with the binary128libs trait use
#                      BINARY128_USE_QUADMATH).
#   bench_note         comment text placed before the benchmark flags.
#   opt_nofma          yes: compile the optimized library with
#                      $(DD_CXXFLAGS) (-ffp-contract=off) although the
#                      backend lacks the nofma trait.
#   rgemm_opt          yes: the optimized library has the Rgemm of
#                      mpblas/optimized/common (openmp/Rgemm_blocked_omp.cpp)
#                      and "make check" runs test/Rgemm_opt_test.
#   rgemm_gpu_host_test
#                      yes: "make check" also runs the CUDA Rgemm code on the
#                      host (test/Rgemm_gpu_host_test, cuda/Rgemm_bridge_cuda.cpp).

[dd]
accelerator = cuda ENABLE_CUDA
rgemm_opt = yes
rgemm_gpu_host_test = yes
smoke_check_only = yes
compare_tolerance = 1e-30
bench_note =
    Note: CUDA benchmarks (Rpotrf.dd_cuda_total, Rgetrf.dd_cuda_total) are built
    via Makefile.dd_cuda.am, included from the top-level Makefile.am under
    the ENABLE_CUDA conditional.

[qd]
accelerator = cuda ENABLE_QD_CUDA
opt_nofma = yes
rgemm_opt = yes
rgemm_gpu_host_test = yes
compare_tolerance = 1e-60

[td]
accelerator = cuda ENABLE_TD_CUDA
rgemm_opt = yes
rgemm_gpu_host_test = yes
compare_tolerance = 1e-45

[double]
smoke_extra = Rgemm.test.double_opt

[gmp]
compare_rlamch_per_abi = yes

[mpfr]
accelerator = cuda ENABLE_MPFR_CUDA
compare_test_env = MPFRXX_DEFAULT_EMAX=32768 MPFRXX_DEFAULT_EMIN=-32765

[binary128]
accelerator = opencl ENABLE_OPENCL_BINARY128
rgemm_opt = yes
