# build-matrix.conf
# Format: name|base|archs|dockerfile|test_cmd|source_type
#
# source_type:
#   branch  = build from git (requires autoreconf)
#   tarball = build from release tarball (no autoreconf)

# === GCC Branch Tests (Debian-based) ===
debian13|debian:13|linux/amd64,linux/386,linux/arm64,linux/ppc64le,linux/s390x,linux/mips64le|Dockerfile.debian|make check|branch
rocky10|rockylinux:10|linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64|Dockerfile.redhat|make check|branch
